# =============================================================================
# Personal academic website of Andrés André Camargo Bertel, built with Quarto.
#
# Adapted from the Quarto academic website by Dr. Gang He
# (https://github.com/drganghe/drganghe.github.io), used under the GNU GPL-3.0.
# Modified in 2026 by Andrés André Camargo Bertel: all content replaced, the
# original author's personal analytics/tracking IDs removed, and the sections
# and templates restructured. As required by the GPL, this derivative work is
# likewise released under the GNU GPL-3.0, see the LICENSE file.
# =============================================================================

project:
  type: website
  output-dir: docs
  resources:
    - "files/"

# Meta
description-meta: "Andrés André Camargo Bertel is a PhD Candidate in Mechanical Engineering at Universidad del Norte (Colombia), specializing in energy systems modeling, renewable energy integration, and transport and industrial decarbonization."
author-meta: "Andrés André Camargo Bertel"

website:
  # Short brand name matches the citable identity (Camargo-Bertel), the GitHub
  # handle and the domain. The full name appears in the hero and the Bio.
  title: "Andrés Camargo"
  image: "/files/profile/andres-camargo.jpg"
  description: "PhD Candidate in Mechanical Engineering, energy systems modeling, renewable energy, transport and industrial decarbonization."
  favicon: "/files/images/favicon.png"

  navbar:
    # Must match $brand-primary in assets/custom.scss (section 1).
    background: "#05336B"
    foreground: "#FFFFFF"

    # Four top-level items, nine destinations. Sections without content yet
    # (Presentations, Projects) are kept to a minimum so the navbar does not
    # promise rooms that are empty.
    left:
      - text: Research
        menu:
          - text: Publications
            href: publications.qmd
          - text: Reports
            href: reports.qmd
          - text: Presentations
            href: presentations.qmd
          - text: Awards
            href: recognition.qmd
      - text: Teaching
        href: teaching.qmd
      - text: Projects
        href: projects.qmd
      - text: About
        menu:
          - text: Bio
            href: bio.qmd
          - text: Now
            href: now.qmd
          - text: News
            href: posts.qmd
          - text: Contact
            href: contact.qmd

    right:
      - text: "**CV**"
        href: files/CV_Andres_Andre_2026.pdf
        target: _blank
      - icon: github
        href: https://github.com/camargo-aa
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/andrés-andré-camargo-bertel-91916319b
        target: _blank
      - icon: envelope
        href: contact.qmd

  page-navigation: true

  page-footer:
    left: |
      [Andrés André Camargo Bertel](https://camargo-aa.github.io) &copy; <script>document.write(new Date().getFullYear())</script>
    center:
      - text: "Publications"
        href: publications.qmd
      - text: "Reports"
        href: reports.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Bio"
        href: bio.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - icon: google
        href: https://scholar.google.com/citations?user=RTRoJm0AAAAJ
        target: _blank
        aria-label: "Google Scholar"
      - icon: github
        href: https://github.com/camargo-aa
        target: _blank
        aria-label: "GitHub"
      - icon: linkedin
        href: https://www.linkedin.com/in/andrés-andré-camargo-bertel-91916319b
        target: _blank
        aria-label: "LinkedIn"
      # No RSS link: posts.qmd is a hand-written timeline with no `listing:`,
      # so Quarto generates no feed. The old navbar RSS icon pointed at a
      # posts.xml left over from an earlier build. To bring a feed back, add a
      # listing with `feed: true` over the posts/ directory.

  search:
    location: navbar
    type: textbox

  reader-mode: false

  draft-mode: unlinked

  open-graph: true

  site-url: "https://camargo-aa.github.io"


format:
  html:
    theme:
      - cosmo
      - assets/custom.scss
    css: assets/styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/camargo-aa\.github\.io'
    include-in-header: "files/includes/_academic.qmd"
    include-after-body: "files/includes/_megamenu.html"
